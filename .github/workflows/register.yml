name: Register to BrainRegistry

on:
  push:
    tags:
      - 'v*'   # triggers only on tags like v0.1.2

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed so Pkg sees tags

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Install LocalRegistry
        run: julia -e 'using Pkg; Pkg.add("LocalRegistry")'

      - name: Checkout BrainRegistry.jl (with token)
        uses: actions/checkout@v4
        with:
          repository: gfayebedrin/BrainRegistry.jl
          path: brain-registry
          fetch-depth: 0
          token: ${{ secrets.BRAINREGISTRY_TOKEN }}  # PAT with repo write on BrainRegistry.jl

      - name: Register to BrainRegistry and push
        env:
          REGISTRY_PATH: ${{ github.workspace }}/brain-registry
        run: |
          set -euo pipefail

          # Register the new version into the local clone of the registry
          julia --color=yes -e '
            using Pkg, LocalRegistry
            reg = ENV["REGISTRY_PATH"]
            LocalRegistry.register(pwd(); registry=reg)
          '

          # Configure committer identity
          git -C "$REGISTRY_PATH" config user.name "github-actions"
          git -C "$REGISTRY_PATH" config user.email "actions@github.com"

          # Commit and push only if there are changes
          if [ -n "$(git -C "$REGISTRY_PATH" status --porcelain)" ]; then
            git -C "$REGISTRY_PATH" add .
            git -C "$REGISTRY_PATH" commit -m "Register new version of $(basename "$GITHUB_REPOSITORY") at $GITHUB_REF"
            git -C "$REGISTRY_PATH" push origin HEAD
          else
            echo "No changes to commit in registry."
          fi
